<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <fieldset class="fieldset">
    <!-- Correo -->
    <fieldset class="fieldset">
      <label class="label">Correo</label>
      <label class="input bg-neutral text-base-content flex w-full items-center gap-2">
        <svg class="h-[1em] opacity-50 text-" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2.5"
            fill="none"
            stroke="currentColor"
          >
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </g>
        </svg>
        <input
          type="email"
          placeholder="Correo electrónico"
          required
          formControlName="email"/>
      </label>

      @if (formUtils.isValidField(loginForm, 'email')) {
        <span class="text-sm text-red-700">
          {{ formUtils.getFieldError(loginForm, 'email') }}
        </span>
      }
    </fieldset>

    <!-- Contraseña -->
    <fieldset class="fieldset mb-4">
      <label class="label" for="password">Contraseña</label>
      <label class="input bg-neutral text-base-content flex w-full items-center gap-2">
        <svg class="h-[1em] shrink-0 opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2.5"
            fill="none"
            stroke="currentColor"
          >
            <path
              d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
            ></path>
            <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
          </g>
        </svg>
        <input
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Contraseña"
          minlength="6"
          title="Deben ser al menos 6 caracteres"
          formControlName="password"
          required
          class="grow"
        />

        <button
          type="button"
          class="btn btn-ghost btn-sm shrink-0 px-0"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          @if (showPassword()) {
            <!-- Ocultar Contraseña -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 3l18 18"></path>
              <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"></path>
              <path d="M9.88 5.09A10.77 10.77 0 0 1 12 4.9c5 0 9 7.1 9 7.1a13.16 13.16 0 0 1-3.05 3.65"></path>
              <path d="M6.61 6.61C4.62 7.96 3 12 3 12s4 7.1 9 7.1a10.9 10.9 0 0 0 4.39-.92"></path>
            </svg>
          }
          @else {
            <!-- Mostrar Contraseña -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          }
        </button>
      </label>

      @if (formUtils.isValidField(loginForm, 'password')) {
        <span class="text-sm text-red-700">
          {{ formUtils.getFieldError(loginForm, 'password') }}
        </span>
      }
    </fieldset>

    <button type="submit" class="btn btn-secondary mb-4">
      Acceder
    </button>

    <p class="text-slate-700">
      ¿No tienes cuenta?
      <a routerLink="/auth/register" class="text-secondary">Crea una aquí</a>
    </p>
  </fieldset>
</form>

@if (hasError()) {
  <alert-error message="Por favor revise la información ingresada."/>
}
